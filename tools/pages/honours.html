<section class="sheet" id="road" hidden></section>
<section class="sheet"><h2>The cups</h2><div class="cups" id="cups"></div></section>
<section class="sheet"><h2>Titles</h2><div id="hon"></div></section>
<section class="sheet"><h2>All-Ireland finals</h2><div id="ai"></div></section>
<section class="sheet"><h2>Munster finals</h2><div id="mu"></div></section>
<section class="sheet"><h2>League finals</h2><div id="nl"></div></section>
<script>
Promise.all([LH.get("honours"),LH.get("matches"),LH.get("media")]).then(function(R){var H=R[0],M=R[1];
 $("cups").innerHTML=R[2].cups.map(function(c){var x=c.h?H[c.h].w:null; return '<div class="card"><img src="/assets/cups/'+c.k+'.webp" alt="'+E(c.t)+'" width="'+c.w+'" height="'+c.ht+'" loading="lazy"><div class="b"><b>'+E(c.t)+'</b><small>'+E(c.comp)+(x?': '+x.n+' titles, last in '+x.y.slice(-1)[0]:'')+'</small><small>'+LH.credit(c.c)+'</small></div></div>'}).join("");
 var RY=LH.ROADS||[]; if(RY.length){$("road").hidden=false; $("road").innerHTML='<div class="rdfeat"><div><div class="kick">Road to the title</div><h2 style="margin:4px 0 0">All-Ireland title runs</h2><div class="yrs" style="margin:10px 0 2px">'+RY.map(function(y){return '<a href="/road/?y='+y+'">'+y+'</a>'}).join("")+'</div><p class="note">Follow the campaign game by game: opponents, grounds, scores and scorers.</p></div><a class="btn" href="/road/?y='+RY[0]+'">Follow the '+RY[0]+' run →</a></div>'}
 function yl(y,c){return c==="aishc"&&RY.indexOf(+y)>=0?'<a class="link" href="/road/?y='+y+'">'+y+'</a>':y}
 function row(t,x){return '<tr><td><b>'+t+'</b></td><td class="n">'+x.w.n+'</td><td>'+x.w.y.map(function(y){return yl(y,x.c)}).join(", ")+'</td><td class="n">'+x.ru.n+'</td><td>'+x.ru.y.join(", ")+'</td></tr>'}
 $("hon").innerHTML='<table class="mu"><thead><tr><th>Competition</th><th class="n">Won</th><th>Years</th><th class="n">Lost</th><th>Finals lost</th></tr></thead><tbody>'+row("All-Ireland",Object.assign({c:"aishc"},H.aishc))+row("National League",H.nl)+row("Munster",H.mshc)+'</tbody></table>';
 function F(c){return M.filter(function(m){return m.cn===c&&/^final/i.test(m.rnd||"")&&m.r}).reverse()}
 $("ai").innerHTML=LH.list(F("AISHC"),{sc:1}); $("mu").innerHTML=LH.list(F("MSHC")); $("nl").innerHTML=LH.list(F("NL"));
}).catch(function(){LH.fail($("hon"))});
</script>
