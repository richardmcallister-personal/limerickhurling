<section class="sheet"><h2>Record against every county</h2><div id="list"></div></section>
<script>
LH.get("opponents").then(function(O){$("list").innerHTML='<table class="mu"><thead><tr><th>County</th><th class="n">P</th><th class="n">W</th><th class="n">D</th><th class="n">L</th><th class="n">For</th><th class="n">Ag</th><th class="n">Win %</th></tr></thead><tbody>'+O.map(function(o){return '<tr><td><a href="/opponent/?o='+o.s+'">'+E(o.n)+'</a></td><td class="n">'+o.p+'</td><td class="n">'+o.w+'</td><td class="n">'+o.d+'</td><td class="n">'+o.l+'</td><td class="n">'+o.gf+'</td><td class="n">'+o.ga+'</td><td class="n">'+(o.p?Math.round(100*o.w/o.p):0)+'</td></tr>'}).join("")+'</tbody></table>'}).catch(function(){LH.fail($("list"))});
</script>
