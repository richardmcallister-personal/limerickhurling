<section class="sheet"><p class="note" style="margin:0">Worked out from the archive only, so a record set in a game Wikipedia doesn't hold won't show. Margins use points value (a goal is 3).</p></section>
<div class="two"><section class="sheet" id="w"></section><section class="sheet" id="l"></section><section class="sheet" id="s"></section><section class="sheet" id="p"></section></div>
<section class="sheet" id="t"></section>
<script>
Promise.all([LH.get("matches"),LH.get("players"),LH.get("seasons")]).then(function(R){var M=R[0].filter(function(m){return m.r}),P=R[1],S=R[2];
 function top(a,f,n){return a.slice().sort(function(x,y){return f(y)-f(x)}).slice(0,n||8)}
 $("w").innerHTML='<h2>Biggest wins</h2>'+LH.list(top(M,function(m){return m.gf-m.ga}),{nov:1});
 $("l").innerHTML='<h2>Heaviest defeats</h2>'+LH.list(top(M,function(m){return m.ga-m.gf}),{nov:1});
 $("s").innerHTML='<h2>Highest scores</h2>'+LH.list(top(M,function(m){return m.gf}),{nov:1});
 var g=[]; R[0].forEach(function(m){(m.sc||[]).forEach(function(x){g.push({n:x[0],g:x[1],p:x[2],m:m})})});
 $("p").innerHTML='<h2>Best individual games</h2><ul class="mlist">'+top(g,function(x){return x.g*3+x.p}).map(function(x){return '<li><span class="d">'+x.m.y+'</span><span class="o"><a href="/player/?p='+LH.slug(x.n)+'">'+E(x.n)+'</a><small><a href="/match/?id='+x.m.id+'">'+LH.crest(x.m.opp,14)+'v '+E(x.m.opp)+', '+E(LH.comp(x.m.cn))+'</a></small></span><span class="score">'+x.g+'-'+x.p+' <small>('+(x.g*3+x.p)+')</small></span></li>'}).join("")+'</ul>';
 var best=0,cur=0,from=null,bf=null,bt=null; M.forEach(function(m){if(m.r!=="L"&&m.d){if(!cur)from=m; cur++; if(cur>best){best=cur;bf=from;bt=m}}else if(m.r==="L")cur=0});
 var ws=0,wc=0,wf,wt,wfrom; M.forEach(function(m){if(m.r==="W"&&m.d){if(!wc)wfrom=m;wc++;if(wc>ws){ws=wc;wf=wfrom;wt=m}}else if(m.r!=="W")wc=0});
 $("t").innerHTML='<h2>Runs and seasons</h2><div class="tiles">'+LH.stat("Longest unbeaten run",best,LH.fmtD(bf.d)+" to "+LH.fmtD(bt.d))+LH.stat("Longest winning run",ws,LH.fmtD(wf.d)+" to "+LH.fmtD(wt.d))+(function(){var s=top(S.filter(function(x){return x.p>=6}),function(x){return x.w/x.p})[0];return LH.stat("Best season by win rate",s.y,s.w+" of "+s.p+" recorded games")})()+'</div>';
}).catch(function(){LH.fail($("w"))});
</script>
