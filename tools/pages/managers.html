<section class="sheet"><h2>Managers since 1972</h2><p class="note" style="margin:0 0 10px">Names and titles from Wikipedia's managerial history. Records count the games in this archive; a handover year goes to the outgoing manager, so they are a guide.</p><div id="list"></div></section>
<script>
LH.get("managers").then(function(M){$("list").innerHTML='<table class="mu"><thead><tr><th>Manager</th><th>Years</th><th class="n">P</th><th class="n">W</th><th class="n">D</th><th class="n">L</th><th>All-Ireland</th><th>Munster</th><th>League</th></tr></thead><tbody>'+M.slice().reverse().map(function(m){return '<tr><td>'+m.n.map(E).join("<br>")+'</td><td class="yrs">'+m.f+'-'+(m.t==="Present"?"":m.t)+'</td><td class="n">'+m.rec.p+'</td><td class="n">'+m.rec.w+'</td><td class="n">'+m.rec.d+'</td><td class="n">'+m.rec.l+'</td><td>'+E(m.ai)+'</td><td>'+E(m.mu)+'</td><td>'+E(m.nl)+'</td></tr>'}).join("")+'</tbody></table>'}).catch(function(){LH.fail($("list"))});
</script>
