<!--nav:Opponents-->
<section class="sheet" id="head"></section>
<div class="two"><section class="sheet" id="ch"></section><section class="sheet" id="nl"></section></div>
<script>
Promise.all([LH.get("opponents"),LH.get("matches")]).then(function(R){
 var s=LH.q("o"), o=R[0].filter(function(x){return x.s===s})[0];
 if(!o){$("head").innerHTML='<p class="empty">No opponent with that name. <a class="link" href="/opponents/">All opponents</a></p>';return}
 document.title="Limerick v "+o.n; $("from").innerHTML="Opponent<span>"+E(o.n)+"</span>";
 var L=R[1].filter(function(m){return m.opp===o.n}).reverse(); function rec(t){return LH.stat("Played",t.p)+LH.stat("Won",t.w)+LH.stat("Drawn",t.d)+LH.stat("Lost",t.l)}
 var big=L.filter(function(m){return m.r==="W"}).sort(function(a,b){return (b.gf-b.ga)-(a.gf-a.ga)})[0], bad=L.filter(function(m){return m.r==="L"}).sort(function(a,b){return (b.ga-b.gf)-(a.ga-a.gf)})[0];
 $("head").innerHTML='<div class="big">Limerick v '+E(o.n)+'</div><div class="tiles">'+rec(o)+'</div><p class="note" style="margin:10px 0 0">'+(big?'Biggest win: '+LH.gp(big.u)+' to '+LH.gp(big.o)+', '+big.y+'. ':'')+(bad?'Heaviest defeat: '+LH.gp(bad.u)+' to '+LH.gp(bad.o)+', '+bad.y+'.':'')+'</p>';
 $("ch").innerHTML='<h2>Championship ('+o.ch.w+'-'+o.ch.d+'-'+o.ch.l+')</h2>'+LH.list(L.filter(function(m){return m.cn!=="NL"}),{nov:1});
 $("nl").innerHTML='<h2>League ('+o.nl.w+'-'+o.nl.d+'-'+o.nl.l+')</h2>'+LH.list(L.filter(function(m){return m.cn==="NL"}),{nov:1});
}).catch(function(){LH.fail($("head"))});
</script>
