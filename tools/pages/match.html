<!--title:Match-->
<!--kick:Match-->
<!--sub:-->
<!--nav:Results-->
<section class="sheet" id="head"></section>
<section class="sheet" id="how" hidden></section>
<section class="sheet" id="tl" hidden style="scroll-margin-top:calc(var(--mast,60px) + 12px)"></section>
<div class="two"><section class="sheet" id="us"></section><section class="sheet" id="them"></section></div>
<section class="sheet" id="vid" hidden style="scroll-margin-top:calc(var(--mast,60px) + 12px)"></section>
<section class="sheet" id="prev"></section>
<script>
Promise.all([LH.get("matches"),LH.get("detail"),LH.get("grounds"),LH.get("videos").catch(function(){return []}),LH.get("clubs").catch(function(){return null}),LH.get("timelines").catch(function(){return {}})]).then(function(R){
 var id=LH.q("id"), m=R[0].filter(function(x){return x.id===id})[0], D=R[1][id]||{};
 if(!m){$("head").innerHTML='<p class="empty">No match with that reference. <a class="link" href="/results/">All results</a></p>';return}
 document.title="Limerick v "+m.opp+" "+m.y; $("from").innerHTML=E(LH.comp(m.cn))+"<span>"+m.y+"</span>";
 var road=(LH.ROADS||[]).indexOf(m.y)>=0&&(m.cn==="AISHC"||m.cn==="MSHC"||m.cn2==="AISHC"||m.cn2==="MSHC");
 var info=[m.d?LH.fmtD(m.d,true):m.y,m.v,D.loc&&(m.v||"").indexOf(D.loc)<0?D.loc:"",D.att?"Attendance "+D.att.replace(/,/g,""):"",D.ref?"Referee "+D.ref:"",D.tv?"TV "+D.tv:""].filter(Boolean);
 $("head").innerHTML='<div class="kick">'+E(LH.comp(m.cn))+(m.rnd?' · '+E(m.rnd):'')+'</div>'+(m.h==="A"?LH.board(m.opp,"Limerick",m):LH.board("Limerick",m.opp,m))+(m.r?'':'<p class="sbmeta">'+E(m.wo||"")+'</p>')+'<p class="note" style="margin:10px 0 0">'+info.map(function(x){return x===m.v&&m.g?'<a class="link" href="/ground/?g='+m.g+'">'+E(x)+'</a>':E(x)}).join(" · ")+'</p>'+(m.cn2?'<p class="note" style="margin:8px 0 0"><span>Also</span>: <span>'+E(LH.comp(m.cn2))+'</span>'+(m.rnd2?' · <span>'+E(m.rnd2)+'</span>':'')+'</p>':'')+(road?'<p style="margin:10px 0 0"><a class="link" href="/road/?y='+m.y+'#g-'+m.id+'">Road to the '+m.y+' title →</a></p>':'')+(function(){var g=R[2].filter(function(x){return x.s===m.g})[0]; return g&&g.c?'<img class="photo" style="margin-top:12px;max-height:320px" src="/assets/grounds/'+g.ph+'.webp" alt="'+E(g.n)+'" width="'+g.iw+'" height="'+g.ih+'" loading="lazy"><p class="note" style="margin:6px 0 0">'+LH.credit(g.c,g.n+'. Not necessarily taken at this match.')+'</p>':""})();
 var V=R[3].filter(function(v){return v.m===id}).sort(function(a,b){var o={highlights:0,video:1,full:2}; return o[a.k]-o[b.k]}); if(V.length){$("vid").hidden=false; $("vid").innerHTML='<h2 class="row">'+(V.length>1?"Videos":"Video")+' <a href="/videos/">All videos →</a></h2>'+V.map(LH.video).join("")}
 var gv=LH.gv(m.y);
 function pts(n,w){return n+' '+(n===1?w:w+'s')}
 // How the score was made: each side's goals and points turned into one total, then the margin
 if(m.r&&m.u&&m.u[0]!=null){
  var sides=[["Limerick",m.u],[m.opp,m.o]]; if(m.h==="A")sides.reverse();
  var rows=sides.map(function(t){var g=t[1][0],p=t[1][1];
   return '<div class="hrow"><div class="hteam">'+LH.crest(t[0],24)+'<span>'+E(t[0])+'</span></div><div class="hsum"><span class="hgp">'+g+'-'+p+'</span><span class="heq">=</span>'+
    '<span class="hpart"><b>'+g+'</b> <span>'+(g===1?"goal":"goals")+'</span>'+(gv?' <span class="hx">× '+gv+' = '+(g*gv)+'</span>':'')+'</span><span class="heq">+</span><span class="hpart"><b>'+p+'</b> <span>'+(p===1?"point":"points")+'</span></span>'+
    '</div>'+(gv?'<div class="htot"><span class="heq">=</span>'+(g*gv+p)+'</div>':'')+'</div>'}).join("");
  var W=m.r==="W"?["Limerick",m.u,m.opp,m.o]:m.r==="L"?[m.opp,m.o,"Limerick",m.u]:null, line="",extra="";
  if(gv){var a=m.u[0]*gv+m.u[1];
   if(!W)line="A draw, "+a+" points each";
   else{var d=(W[1][0]*gv+W[1][1])-(W[3][0]*gv+W[3][1]); line=W[0]+" won by "+pts(d,"point");
    if(W[1][1]<W[3][1]&&W[1][0]>W[3][0])extra=W[2]+" scored more points, "+W[3][1]+" to "+W[1][1]+", but goals made the difference: "+W[1][0]+" to "+W[3][0]+".";
    else if(W[1][0]<W[3][0])extra=W[2]+" scored more goals, "+W[3][0]+" to "+W[1][0]+", but "+W[0]+" scored more points, "+W[1][1]+" to "+W[3][1]+".";}
  }else{ if(!W)line="A draw";
   else if(W[1][0]!==W[3][0])line=W[0]+" won on goals, "+W[1][0]+" to "+W[3][0];
   else line=W[0]+" won on points, "+W[1][1]+" to "+W[3][1]+", with goals level";}
  var rule=gv===3?"A goal, into the net under the bar, is worth 3 points. A point, over the bar, is worth 1. Add them up: the higher total wins.":gv===5?"From 1892 to 1895 a goal was worth 5 points; it has been worth 3 since 1896. A point, over the bar, is worth 1.":"Until 1892 a goal outweighed any number of points: goals were compared first, and points only counted when the goals were level.";
  $("how").hidden=false; $("how").innerHTML='<h2>How the score was made</h2><div class="hgrid">'+rows+'</div><p class="hres '+m.r+'">'+E(line)+'</p>'+(extra?'<p class="hextra">'+E(extra)+'</p>':'')+'<p class="note" style="margin:10px 0 0">'+rule+'</p>';
 }
 // Who scored what: each player's goals and points, their points value and share of the side's total
 function contrib(sc,want,link,side){if(!sc||!sc.length)return '<p class="note" style="margin:0">Not recorded.</p>';
  var L=sc.slice().sort(function(a,b){return (b[1]*(gv||3)+b[2])-(a[1]*(gv||3)+a[2])}), sg=0,sp=0; L.forEach(function(s){sg+=s[1];sp+=s[2]});
  var XC=R[4]?LH.clubIdx(R[4]):null;
  function nm(s){if(!link)return E(s[0]); var w=XC&&XC.of(s[0]), c=w&&w.cl[0], k=c&&XC.S[LH.slug(c)];
   return '<a href="/player/?p='+LH.slug(s[0])+'">'+E(s[0])+'</a>'+(c?'<a class="clsub" href="/club/?c='+(k?k.s:'')+'">'+LH.badge(k,11)+E(c)+'</a>':'')}
  if(!gv)return '<table class="mu"><tbody>'+L.map(function(s){return '<tr><td>'+nm(s)+'</td><td class="n">'+s[1]+'-'+s[2]+'</td></tr>'}).join("")+'</tbody></table>';
  var tot=want&&want[0]!=null?want[0]*gv+want[1]:sg*gv+sp, rec=sg*gv+sp, miss=Math.max(0,tot-rec), base=Math.max(tot,rec);
  var segs=L.map(function(s,i){return {n:s[0],v:s[1]*gv+s[2],c:i<6?"c"+i:"co"}}); if(miss)segs.push({n:"Not in the source",v:miss,c:"cx"});
  var bar='<div class="cbar '+side+'" role="img" aria-label="Share of the total by player">'+segs.map(function(x){return '<span class="'+x.c+'" style="flex:'+x.v+' 1 0" title="'+E(x.n)+': '+x.v+'"></span>'}).join("")+'</div>';
  var mx=Math.max.apply(null,L.map(function(s){return s[1]*gv+s[2]}).concat([miss]));
  function row(lab,cls,score,v){var pc=Math.round(100*v/base), bw=Math.round(100*v/mx); return '<tr'+(cls==="cx"?' class="miss"':'')+'><td><span class="sw '+cls+'" aria-hidden="true"></span>'+lab+'</td><td class="n">'+score+'</td><td class="n"><b>'+v+'</b></td><td class="sh"><span class="shb '+side+'"><i style="width:'+bw+'%"></i></span><span class="n">'+pc+'%</span></td></tr>'}
  var top=L[0], tv=top[1]*gv+top[2];
  var tbl='<table class="mu ctab '+side+'"><thead><tr><th>Player</th><th class="n">Score</th><th class="n">Value</th><th class="sh">Share</th></tr></thead><tbody>'+L.map(function(s,i){return row(nm(s),i<6?"c"+i:"co",s[1]+'-'+s[2],s[1]*gv+s[2])}).join("")+(miss?row('<span>Not in the source</span>',"cx","",miss):'')+'</tbody></table>';
  var over=rec>tot?'<p class="note" style="margin:8px 0 0">The source\'s scorers add to '+sg+'-'+sp+', not '+want[0]+'-'+want[1]+'.</p>':'';
  return bar+'<p class="ctop">'+E("Top scorer: "+top[0]+", "+tv+" of "+tot+" points ("+Math.round(100*tv/base)+"%)")+'</p>'+tbl+over}
 $("us").innerHTML='<h2>Limerick scorers</h2>'+contrib(m.sc,m.u,1,"us"); $("them").innerHTML='<h2>'+LH.crest(m.opp,20)+E(m.opp)+' scorers</h2>'+contrib(D.osc,m.o,0,"opp");
 // Matchday timeline: key moments from the final's Wikipedia article, subs and cards from its team sheets
 var TL=(R[5]||{})[id];
 if(TL){var opp=m.opp, dur=TL.dur, T=TL.ev, fil="all";
  function mins(e){if(e.d!=null&&e.d!=="")return e.d==="HT"||e.d==="FT"?e.d:e.d+"'"; if(e.d==="")return ""; var x=Math.floor(e.m); return x>dur?dur+"+"+(x-dur)+"'":x+"'"}
  function gp(a,b){return a+"-"+b}
  function state(e){if(e.sc)return '<b>'+gp(e.sc[0],e.sc[1])+'</b> <span class="note">–</span> <b>'+gp(e.sc[2],e.sc[3])+'</b>'; if(e.lead==null)return ""; return e.lead===0?'<span>Level</span>':'<span>'+E((e.lead>0?"Limerick":opp)+" by "+Math.abs(e.lead))+'</span>'}
  function chart(){var P=[[0,0]].concat(T.filter(function(e){return e.lead!=null&&!e.x&&e.k!=="ft"}).map(function(e){return [e.m,e.lead]})), ft=T[T.length-1]; P.push([ft.m,ft.lead]);
   var X=Math.max(dur,ft.m), Y=Math.max(4,Math.max.apply(null,P.map(function(p){return Math.abs(p[1])}))), W=640,H=150,pl=8,pr=8,pt=12,pb=22,
    x=function(v){return pl+(W-pl-pr)*v/X}, y=function(v){return pt+(H-pt-pb)*(Y-v)/(2*Y)}, z=y(0);
   var line=P.map(function(p,i){return (i?"L":"M")+x(p[0]).toFixed(1)+" "+y(p[1]).toFixed(1)}).join(" "), area=line+" L"+x(P[P.length-1][0]).toFixed(1)+" "+z+" L"+x(0)+" "+z+"Z";
   return '<div class="tlchart"><svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="Limerick\'s lead through the game"><defs><clipPath id="tlup"><rect x="0" y="0" width="'+W+'" height="'+z+'"/></clipPath><clipPath id="tldn"><rect x="0" y="'+z+'" width="'+W+'" height="'+(H-z)+'"/></clipPath></defs>'+
    '<path d="'+area+'" class="up" clip-path="url(#tlup)"/><path d="'+area+'" class="dn" clip-path="url(#tldn)"/>'+
    '<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+z+'" y2="'+z+'" class="zero"/><line x1="'+x(dur/2)+'" x2="'+x(dur/2)+'" y1="'+pt+'" y2="'+(H-pb)+'" class="half"/>'+
    '<path d="'+line+'" class="ln" vector-effect="non-scaling-stroke"/></svg>'+
    P.slice(1).map(function(p){return '<i class="dot'+(p[1]>0?' u':p[1]<0?' d':'')+'" style="left:'+(100*x(p[0])/W).toFixed(2)+'%;top:'+(100*y(p[1])/H).toFixed(2)+'%"></i>'}).join("")+
    '<span class="tly tlu">'+E("Limerick ahead")+'</span><span class="tly tld">'+E(opp+" ahead")+'</span><span class="tlx" style="left:'+(100*x(dur/2)/W)+'%">HT</span><span class="tlx" style="left:'+(100*x(dur)/W)+'%">'+dur+'\'</span></div>'}
  function row(e){var side=e.s==="L"?"us":"them", cr=e.s==="L"?LH.crest("Limerick",16):LH.crest(opp,16);
   if(e.k==="ht"||e.k==="ft")return '<li class="tlsep"><span class="tm">'+(e.k==="ht"?"HT":"FT")+'</span><span class="tx"><b>'+(e.k==="ht"?"Half-time":"Full time")+'</b></span><span class="tlrs">'+state(e)+'</span></li>';
   var ic=e.k==="goal"?'<span class="ic goal">Goal</span>':e.k==="point"?'<span class="ic pt">Point</span>':e.k==="sub"?'<span class="ic sub" title="Substitution" aria-label="Substitution"><svg viewBox="0 0 16 16" width="14" height="14"><path d="M3 5h9l-3-3M13 11H4l3 3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>':e.k==="card"?'<span class="ic yc" title="Yellow card" aria-label="Yellow card"></span>':e.k==="red"?'<span class="ic rc" title="Red card" aria-label="Red card"></span>':'<span class="ic nt"></span>';
   var tx=e.k==="sub"?(e.on?cr+'<b>'+E(e.on)+'</b> <span class="note">on</span>'+(e.off?' <span class="note">for</span> '+E(e.off):''):cr+'<b>'+E(e.off)+'</b> <span class="note">off</span>'):cr+(e.who?'<b>'+E(e.who)+'</b> ':'')+(e.t?'<span>'+E(e.t)+'</span>':'');
   return '<li class="tl'+side+' k-'+e.k+'"><span class="tm">'+mins(e)+'</span>'+ic+'<span class="tx">'+tx+'</span><span class="tlrs">'+state(e)+'</span></li>'}
  function draw(){var L=T.filter(function(e){return fil==="all"||e.k==="goal"||e.k==="point"||e.k==="ht"||e.k==="ft"||e.sc});
   $("tl").innerHTML='<h2 class="row">Matchday timeline <span class="seg" role="group" aria-label="Show">'+[["all","Everything"],["sc","Scores only"]].map(function(o){return '<button type="button" data-f="'+o[0]+'" aria-pressed="'+(fil===o[0])+'">'+o[1]+'</button>'}).join("")+'</span></h2>'+(T.filter(function(e){return e.lead!=null&&!e.x&&e.k!=="ft"&&e.k!=="ht"}).length>=2?chart():'')+
    '<ol class="tlist"><li class="tlsep"><span class="tm">0\'</span><span class="tx"><b>Throw-in</b></span><span class="tlrs"></span></li>'+L.map(row).join("")+'</ol>'+
    '<p class="note" style="margin:12px 0 0">Key moments from Wikipedia\'s article <a class="link" href="https://en.wikipedia.org/wiki/'+encodeURIComponent(TL.src.replace(/ /g,"_"))+'" target="_blank" rel="noopener">'+E(TL.src)+'</a>; substitutions and cards from its team sheets. Scores and margins appear only where the article gives them, so the chart joins those moments with straight lines and not every score is listed.</p>';
   [].forEach.call($("tl").querySelectorAll(".seg button"),function(b){b.onclick=function(){fil=b.getAttribute("data-f");draw()}})}
  $("tl").hidden=false; draw()}
 var P=R[0].filter(function(x){return x.opp===m.opp&&x.id!==id&&x.r}).slice().reverse().slice(0,6);
 $("prev").innerHTML='<h2>Other meetings</h2>'+LH.list(P,{nov:1})+'<p style="margin:10px 0 0"><a class="link" href="/opponent/?o='+LH.slug(m.opp)+'">Full record v '+E(m.opp)+' →</a> · <a class="link" href="https://en.wikipedia.org/wiki/'+encodeURIComponent((D.src||"").replace(/ /g,"_"))+'">Source article</a></p>';
}).catch(function(){LH.fail($("head"))});
</script>
