<script src="/lh.js"></script>
<script>
(function(){
LH.nav('Season');
var $=function(i){return document.getElementById(i)}, E=LH.esc;

Promise.all([LH.get("matches"),LH.get("seasons"),LH.get("honours"),LH.get("managers")]).then(function(R){
 var M=R[0],S=R[1],H=R[2],sel=$("y"),ys=S.map(function(s){return s.y}).reverse(), y=+LH.q("y")||ys[0]; if(ys.indexOf(y)<0)y=ys[0];
 sel.innerHTML=ys.map(function(v){return '<option value="'+v+'"'+(v===y?' selected':'')+'>'+v+'</option>'}).join("");
 function draw(y){
  var L=M.filter(function(m){return m.y===y}), t=LH.tot(L), won=[];
  if(H.aishc.w.y.indexOf(String(y))>=0)won.push("All-Ireland"); if(H.mshc.w.y.indexOf(String(y))>=0)won.push("Munster");
  if(H.nl.w.y.some(function(n){return n===String(y)||n.indexOf(String(y)+"–")===0}))won.push("League");
  $("tiles").innerHTML=LH.stat("Recorded games",t.p,t.w+" won, "+t.d+" drawn, "+t.l+" lost")+LH.stat("Scored",t.gf,"Points value")+LH.stat("Conceded",t.ga,"Points value")+(won.length?LH.stat("Titles",won.length,won.join(", ")):"")+(function(){var G=R[3].filter(function(g){return g.a<=y&&y<=g.b}); return G.length?'<div class="stat"><div class="k">Manager</div><div class="s" style="font-size:15px;margin-top:6px">'+G.map(function(g){return g.n.map(function(x){return '<a class="link" href="/manager/?m='+x.s+'">'+E(x.n)+'</a>'}).join(", ")}).join("<br>")+'</div></div>':""})();
  $("comps").innerHTML=["AISHC","MSHC","NL"].map(function(c){var X=L.filter(function(m){return m.cn===c}); return X.length?'<section class="sheet"><h2>'+E(LH.comp(c))+'</h2>'+LH.list(X,{sc:1})+'</section>':''}).join("");
  var by={}; L.forEach(function(m){(m.sc||[]).forEach(function(s){var x=by[s[0]]=by[s[0]]||{n:s[0],g:0,p:0,c:0}; x.g+=s[1]; x.p+=s[2]; x.c++})});
  var A=Object.keys(by).map(function(k){return by[k]}).sort(function(a,b){return (b.g*3+b.p)-(a.g*3+a.p)});
  $("scorers").innerHTML='<h2>Scorers in '+y+'</h2>'+(A.length?'<table class="mu"><thead><tr><th>Player</th><th class="n">Games</th><th class="n">Score</th><th class="n">Total</th></tr></thead><tbody>'+A.slice(0,20).map(function(p){return '<tr><td><a href="/player/?p='+LH.slug(p.n)+'">'+E(p.n)+'</a></td><td class="n">'+p.c+'</td><td class="n">'+p.g+'-'+p.p+'</td><td class="n"><b>'+(p.g*3+p.p)+'</b></td></tr>'}).join("")+'</tbody></table>':'<p class="note" style="margin:0">No scorers recorded for this season.</p>');
  $("from").innerHTML="Season<span>"+y+"</span>"; document.title="Limerick Hurling · "+y;
 }
 sel.addEventListener("change",function(){var v=+sel.value; history.replaceState(null,"","?y="+v); draw(v)}); draw(y);
}).catch(function(){LH.fail($("comps"))});

})();
</script></body></html>
